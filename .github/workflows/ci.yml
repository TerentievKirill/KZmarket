name: KZmarket checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP, shell, JavaScript and Compose
        run: |
          find theme scripts -name '*.php' -print0 | xargs -0 -n 1 php -l
          bash -n scripts/*.sh
          node --check theme/kzmarket/assets/navigation.js
          cp .env.example .env
          sed -i 's/replace-with-a-strong-password/ci-password-1/g; s/replace-with-another-strong-password/ci-password-2/g; s/replace-with-a-long-unique-password/ci-password-3/g; s/admin@example.com/ci@example.test/g' .env
          docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated test credentials
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-strong-password/ci-password-1/g; s/replace-with-another-strong-password/ci-password-2/g; s/replace-with-a-long-unique-password/ci-password-3/g; s/admin@example.com/ci@example.test/g' .env
          chmod +x scripts/*.sh
      - name: Install WordPress and WooCommerce
        run: ./scripts/install.sh
      - name: Seed test catalogue
        run: ./scripts/seed-demo.sh
      - name: Check public pages
        run: ./scripts/smoke.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop test containers
        if: always()
        run: docker compose down
