# Replace shop.example.kz with the real domain and provision TLS separately.
# Docker binds WordPress to 127.0.0.1:8080 by default.
# If there is a separate Nginx reverse proxy, configure HTTPS there.
server {
    listen 80;
    server_name shop.example.kz;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
